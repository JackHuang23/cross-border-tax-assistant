name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: cross-border-tax-assistant-linux-x64.tar.gz
          - os: windows-latest
            name: windows-x64
            archive: cross-border-tax-assistant-windows-x64.zip
          - os: macos-latest
            name: macos-arm64
            archive: cross-border-tax-assistant-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt
      - name: Build with PyInstaller
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --onedir --name cross-border-tax-assistant \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            --add-data "docs${SEP}docs" \
            app.py
      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: cd dist && tar -czf "${{ matrix.archive }}" cross-border-tax-assistant/
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: cd dist && Compress-Archive -Path cross-border-tax-assistant -DestinationPath "${{ matrix.archive }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  python-source:
    name: Package Python source (only needs Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          set -e
          DST=cross-border-tax-assistant-python
          rm -rf "$DST" cross-border-tax-assistant-python.zip
          mkdir -p "$DST"
          cp -r app.py tax_engine static templates docs requirements.txt LICENSE LICENSE.EXCEPTION start.py run.sh run.bat uninstall.sh uninstall.bat "$DST"/
          {
            echo '跨境个人税务助理 —— Python 版（只需安装 Python 3.9+）'
            echo
            echo '运行：'
            echo '  Windows     双击 run.bat   （或 python start.py）'
            echo '  Linux/macOS ./run.sh       （或 python3 start.py）'
            echo '首次运行自动联网安装依赖，然后打开 http://localhost:5000'
            echo
            echo '卸载（绿色便携式，不写注册表/不留服务）：'
            echo '  Windows     双击 uninstall.bat，再删除整个文件夹'
            echo '  Linux/macOS ./uninstall.sh，再删除整个文件夹'
            echo
            echo '许可：AGPL-3.0 + FLOSS 兼容性例外（见 LICENSE / LICENSE.EXCEPTION）。'
            echo '免责声明：仅供教学与参考，不构成税务意见。'
          } > "$DST/README.txt"
          zip -r cross-border-tax-assistant-python.zip "$DST"
      - uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: cross-border-tax-assistant-python.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, python-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
