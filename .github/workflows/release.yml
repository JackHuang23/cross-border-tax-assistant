name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: cross-border-tax-assistant-linux-x64.tar.gz
          - os: windows-latest
            name: windows-x64
            archive: cross-border-tax-assistant-windows-x64.zip
          - os: macos-latest
            name: macos-arm64
            archive: cross-border-tax-assistant-macos-arm64.tar.gz
          - os: macos-13
            name: macos-x64
            archive: cross-border-tax-assistant-macos-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --onedir --name cross-border-tax-assistant \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            --add-data "docs${SEP}docs" \
            app.py

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: cd dist && tar -czf "${{ matrix.archive }}" cross-border-tax-assistant/

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: cd dist && Compress-Archive -Path cross-border-tax-assistant -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
